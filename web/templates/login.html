<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D10">
<meta name="robots" content="noindex, nofollow">
<title>Login · Social Credit</title>
<link rel="icon" href="/static/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/static/theme.css?v=1">
<link rel="stylesheet" href="/static/login.css?v=2">
</head>
<body>
<main class="box">
  <img class="login-mark" src="/static/logo.png" alt="" width="52" height="52">
  <h1 class="brand">
    CCP Surveillant
    <small>Admin Console</small>
  </h1>
  <form id="form">
    <label class="form-label" for="token">Access token</label>
    <input type="password" id="token" class="form-control" placeholder="••••••••••••" autofocus autocomplete="current-password">
    <button type="submit" class="btn-login">ENTER</button>
    <div class="err" id="err" role="alert">Invalid token.</div>
  </form>
</main>
<script src="/static/login.js"></script>
</body>
</html>
