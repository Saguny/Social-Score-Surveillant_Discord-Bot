<script>
  (function () {
    var wrap = document.getElementById('footer-credit');
    if (!wrap) return;
    fetch('/api/appearance').then(function (r) { return r.ok ? r.json() : null; }).then(function (a) {
      if (!a || !a.credit_name) return;
      var label = (typeof t === 'function' ? t('Background art by') : 'Background art by');
      var name = document.createTextNode(a.credit_name);
      wrap.textContent = label + ' ';
      if (/^https?:\/\//i.test(a.credit_url || '')) {
        var link = document.createElement('a');
        link.href = a.credit_url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.appendChild(name);
        wrap.appendChild(link);
      } else {
        wrap.appendChild(name);
      }
      wrap.hidden = false;
    }).catch(function () {});
  })();
</script>
