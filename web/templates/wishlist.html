<!DOCTYPE html>
<html lang="en">
<head>
  <!--#include head-->
  <meta name="robots" content="noindex, nofollow">
  <title>Community Wishlist · Social Credit</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=3">
  <link rel="stylesheet" href="/static/submit.css?v=6">
</head>
<body>

<div class="app">
  <!--#include shell-->

  <div class="app-main">
    <header class="topbar">
      <button class="icon-btn" id="nav-hamburger" data-i18n-aria="Open navigation menu" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-sidebar">
        <svg width="20" height="20" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar-title">
        <h1 data-i18n="WISHLIST">WISHLIST</h1>
        <span class="topbar-sub" data-i18n="Community Wishlist">Community Wishlist</span>
      </div>
    </header>

    <main class="app-content" id="main">
      <div class="page-wrap">

        <div class="discord-bar" id="discord-bar">
          <div class="avatar-placeholder" id="db-placeholder"></div>
          <span style="font-size:.82rem;color:var(--text-muted)" data-i18n="Checking login…">Checking login…</span>
        </div>

        <div class="page-title" data-i18n="Community Wishlist">Community Wishlist</div>
        <p class="page-sub" data-i18n-html="wishlist_intro">Characters the community wants added most. Vote for your favourites, highly-supported requests go to the top of the admin review queue. Got someone in mind? <a href="/social-credit/submit">Submit a suggestion.</a></p>

        <div class="wl-sort-bar" role="group" data-i18n-aria="Sort wishlist" aria-label="Sort wishlist">
          <button class="wl-sort-btn active" data-sort="votes" data-i18n="Top Voted">Top Voted</button>
          <button class="wl-sort-btn" data-sort="newest" data-i18n="Newest">Newest</button>
          <button class="wl-sort-btn" data-sort="approved" data-i18n="Recently Approved">Recently Approved</button>
        </div>

        <div id="wl-list">
          <div class="wl-empty" data-i18n="Loading…">Loading…</div>
        </div>

      </div>
    </main>

    <!--#include footer-->
  </div>
</div>

<div class="toast-wrap"><div class="toast-msg" id="toast"></div></div>

<script src="/static/wishlist.js?v=3"></script>
<script>document.addEventListener('click',async function(e){var l=e.target.closest('a.logout-link');if(!l)return;e.preventDefault();await fetch('/social-credit/auth/discord/logout',{method:'POST',credentials:'same-origin'});window.location.href='/social-credit/wishlist';});</script>
<!--#include scripts-->
</body>
</html>
